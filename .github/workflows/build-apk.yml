name: Build & Release APK

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PocketArcade.apk

      - name: Write release notes
        run: |
          cat > notes.md << 'EOF'
          ## Pocket Arcade - Latest Build

          ### Install on Android (API 26+)
          1. Download **PocketArcade.apk** below
          2. On your phone: Settings > Security > enable "Install unknown apps"
          3. Open the downloaded APK and tap Install

          Includes: Snake, Pong, Asteroids, Brick Breaker

          > Built automatically from the latest commit.
          EOF

      - name: Delete existing latest release
        run: gh release delete latest --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: gh release create latest PocketArcade.apk --title "Pocket Arcade - Latest Build" --notes-file notes.md --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
