name: Build & Release APK

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        run: git clone "https://github.com/${{ github.repository }}.git" . && git checkout "${{ github.sha }}"

      - name: Select Java 17
        run: |
          echo "JAVA_HOME=$(update-java-alternatives -l | grep '17' | awk '{print $3}')" >> $GITHUB_ENV
          sudo update-java-alternatives -s "$(update-java-alternatives -l | grep '17' | awk '{print $1}')"
          java -version

      - name: Compute version tag
        run: |
          PATCH=$(git rev-list --count HEAD)
          echo "RELEASE_TAG=v1.3.${PATCH}" >> $GITHUB_ENV

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionName=${RELEASE_TAG#v} \
            -Pandroid.injected.signing.store.file=$PWD/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEYSTORE_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PocketArcade.apk

      - name: Write release notes
        run: |
          cat > notes.md << 'EOF'
          ## Pocket Arcade - ${{ env.RELEASE_TAG }}

          ### Install on Android (API 26+)
          1. Download PocketArcade.apk below
          2. On your phone: Settings > Security > enable "Install unknown apps"
          3. Open the downloaded APK and tap Install

          Includes: Snake, Pong, Asteroids, Brick Breaker
          EOF

      - name: Create release
        run: gh release create "$RELEASE_TAG" PocketArcade.apk --title "Pocket Arcade $RELEASE_TAG" --notes-file notes.md --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
