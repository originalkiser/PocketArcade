name: Build & Release APK

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk PocketArcade.apk

      - name: Delete old release (if exists)
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release with APK
        run: |
          gh release create latest PocketArcade.apk \
            --title "Pocket Arcade — Latest Build" \
            --notes "## Install on Android

          1. Download **PocketArcade.apk** below
          2. On your phone go to **Settings → Security** and enable **Install unknown apps** for your browser or Files app
          3. Open the downloaded APK and tap Install

          > Requires Android 8.0 (API 26) or higher.
          > Built automatically from the latest commit." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
